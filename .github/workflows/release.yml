name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Resolve version from tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Set Maven project version
      run: mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

    - name: Build
      run: mvn -B verify --file pom.xml

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FAT_JAR="target/nginx-auth-${VERSION}-jar-with-dependencies.jar"
        ASSET="target/nginx-auth-${VERSION}.jar"
        test -f "$FAT_JAR"
        cp "$FAT_JAR" "$ASSET"
        gh release create "$GITHUB_REF_NAME" "$ASSET" \
          --title "$VERSION" \
          --generate-notes
